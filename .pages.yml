media:
  input: public/media
  output: /media

components:
  pageHeader:
    - { name: title, label: Título, type: string, required: true }
    - { name: subtitle, label: Subtítulo, type: text }
    - { name: image, label: Imagen de cabecera, type: image }

content:
  - name: artistas
    label: Artistas
    type: collection
    path: content/artistas
    filename: "{primary}.md"
    view:
      primary: name
      fields: [photo, name, genres, order]
      sort: [order]
      default: { sort: order, order: asc }
    fields:
      - { name: name, label: Nombre, type: string, required: true }
      - { name: photo, label: Foto (vertical, 4:5), type: image, required: true }
      - { name: genres, label: Estilos, type: string, list: true }
      - { name: events, label: Tipos de evento, type: select, list: true, options: { values: [Bodas, Eventos de empresa, Pool party, Cumpleaños] } }
      - { name: spotify, label: Spotify (URL), type: string }
      - { name: instagram, label: Instagram (URL), type: string }
      - { name: order, label: Orden, type: number, default: 99 }
      - { name: body, label: Bio, type: rich-text }

  - name: blog
    label: Blog
    type: collection
    path: content/blog
    filename: "{primary}.md"
    view:
      primary: title
      fields: [cover, title, date]
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: date, label: Fecha, type: date, required: true }
      - { name: cover, label: Portada (16:9), type: image, required: true }
      - { name: excerpt, label: Resumen, type: text, description: "Una o dos frases. Aparece en la lista del blog y en la portada." }
      - { name: body, label: Texto, type: rich-text }

  - name: playlists
    label: Playlists
    type: collection
    path: content/playlists
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, styles, featured, order]
      sort: [order]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Nombre, type: string, required: true }
      - { name: spotify, label: Enlace de Spotify, type: string, required: true, description: "En Spotify: Compartir > Copiar enlace de la playlist." }
      - { name: styles, label: Estilos, type: string, list: true, description: "Escríbelos igual que en los estilos de los artistas (ej. Funk, House). Así la playlist aparece en la ficha de cada artista con ese estilo." }
      - { name: featured, label: Mostrar en la portada, type: boolean, default: false, description: "Se muestran las 4 primeras marcadas." }
      - { name: order, label: Orden, type: number, default: 99 }

  - name: testimonios
    label: Testimonios
    type: collection
    path: content/testimonios
    filename: "{primary}.md"
    view:
      primary: name
      fields: [name, event, order]
      sort: [order]
      default: { sort: order, order: asc }
    fields:
      - { name: quote, label: Testimonio, type: text, required: true, description: "Dos o tres frases como máximo." }
      - { name: name, label: Nombre, type: string, required: true, description: "Ej. Laura y Marc" }
      - { name: event, label: Evento, type: string, description: "Ej. Boda en Sitges · 2025" }
      - { name: order, label: Orden, type: number, default: 99 }

  - name: site
    label: Datos de contacto
    type: file
    path: content/site.json
    fields:
      - { name: name, label: Nombre, type: string }
      - { name: tagline, label: Lema, type: string }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Teléfono, type: string }
      - { name: address, label: Dirección, type: string }
      - { name: instagram, label: Instagram (URL), type: string }
      - { name: spotify, label: Spotify (URL), type: string }
